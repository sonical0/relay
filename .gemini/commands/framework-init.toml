name = "framework-init"
description = "Set Relay up on this machine: brain, hooks, skills, status, index."

prompt = """
Run the Relay initialization for this machine and report what happened. Do not skip a
step silently — if one fails, say so and continue with the rest.

## 1. Check

- node --version — Relay needs Node 20+. Stop here if it is older.
- Hostname ($RELAY_HOST if set, else $env:COMPUTERNAME / hostname): the key under
  `machines:` in the brain.

## 2. Run

    npm run init -- --dry-run
    npm run init

TOOLS/relay-init.mjs creates relay-brain.yml with this machine if missing, installs the
dependency, links skills and copies rules, derives status, builds the index and the
injected state. It also installs Claude Code hooks into the user's home configuration:
you are sandboxed to RELAY_ROOT, so that step may fail for you. Say so plainly and tell the
user to run `npm run hooks` from a Claude Code session or a plain terminal. Relay works
without hooks; you then read .relay-state.md yourself at the start of a session.

## 3. The brain

Under `agents:` in relay-brain.yml, keep only the CLIs actually installed. Leave
`projects:` alone; projects are added with node TOOLS/new-project.mjs. Never invent an
`intent:` value: it is the user's to declare.

## 4. Verify and report

    npm test
    npm run rag -- --query "atomic write validate before swap"

Summarise: OS and hostname, agents found, on-demand vs native skills, projects detected,
and anything that failed. Finally, the one habit that matters: open the agent inside the
project directory, not at the Relay root — the injected state is then about that project.
"""
