# Relay Agent Brain — Référence statique
# INSTRUCTIONS : copier ce fichier en relay-brain-ref.yml après setup.
# Ce fichier contient les sections STABLES (capacités, conventions, architecture).
# L'état VOLATILE (projets, claims, wmux, cross_project_log) → relay-brain.yml
#
# RÈGLE : Ce fichier ne change qu'en cas de modification de l'architecture Relay.
#         Ne pas modifier entre sessions normales.

version: 1
type: relay-brain-ref

architecture:
  hub: "./relay-brain.yml"
  ref: "./relay-brain-ref.yml"
  spoke_pattern: "./PROJECTS/{PROJECT}/"
  skills_dir: "./SKILLS/"
  tools_dir: "./TOOLS/"
  note: >
    Tous les chemins sont relatifs depuis RELAY_ROOT (dossier contenant AGENTS.md).
    Variable d'env $RELAY_ROOT optionnelle — prend la priorité si définie.
    Scripts Node.js : path.dirname(fileURLToPath(import.meta.url)) + navigation relative.

agents:
  claude:
    cli: claude-code
    sandbox: null
    can:
      - pdf-generation
      - node-scripts
      - file-write
      - webfetch
      - websearch
      - wmux-browser
      - wmux-orchestrator
      - subagents-claude
    cannot:
      - playwright-live
    subagents: [Explore, Plan, general-purpose]
    notes: >
      Orchestrateur principal. Accès filesystem complet.
      wmux-orchestrator disponible si wmux opérationnel.

  antigravity:
    cli: antigravity-cli
    alias: agy
    compat: gemini-cli   # ancien nom — toujours supporté
    sandbox: "./"
    can:
      - playwright-headless
      - node-scripts
      - python
      - shell
      - file-write-sandbox
      - wmux-browser
      - subagents-agy
    cannot:
      - paths-outside-sandbox
      - wmux-orchestrator
    subagents: [generalist, codebase_investigator]
    notes: >
      Worker. Sandboxé dans RELAY_ROOT. Fort sur ingestion/scraping.
      Playwright headless disponible.

conventions:
  encoding_rule: >
    Toujours UTF-8 (sans BOM).
    INTERDICTION : Ne JAMAIS utiliser PowerShell pour texte accentué.
    OBLIGATION : write_file/replace ou Node.js gérant l'UTF-8 nativement.
  log_format: "## YYYY-MM-DD — Agent (projet : sujet) + max 5 bullets, 15 mots, pas de sous-listes"
  log_granularity: batch-summary
  liveness_owner: antigravity
  pdf_owner: claude
  merge_owner: claude
  evaluation_owner: claude
  scan_owner: antigravity
  cross_project_log_max_days: 30
  cross_project_log_archive: "./relay-brain-history.yml"
  bootstrap_generic: "./relay-bootstrap.md"
  bootstrap_local: ".relay-bootstrap.md"
  relay_log: "./RELAY_LOG.md"
  relay_chat: "./RELAY_CHAT.md"
  tools_manifest: "./TOOLS/README.md"
  state_protocol: >
    Lire relay-brain.yml → RELAY_LOG.md (50 dernières lignes) →
    .relay-bootstrap.md projet → commencer.
    Écrire atomiquement : lire → modifier → sauvegarder en une seule opération.
  subagent_delegation:
    claude_subagents: [Explore, Plan, general-purpose]
    agy_subagents: [generalist, codebase_investigator]
    thresholds:
      volume: ">3 fichiers"
      speculative: "recherche fichiers inconnus"
      batch: "même tâche × N"
    sandbox_note: "Sous-agents héritent du sandbox parent"
  cross_orchestration:
    orchestrator: claude
    worker: antigravity
    spawn_cmd: 'wmux agent spawn --cmd "agy -p @prompt.md"'

message_broker:
  server: "python3 TOOLS/relay-server.py"
  port: 7432
  pid_file: "/tmp/relay-server.pid"
  chat_cli: "node TOOLS/relay-chat.mjs"
  agent_loop: "bash TOOLS/relay-agent-loop.sh"
  chat_file: "./RELAY_CHAT.md"
  start: "bash TOOLS/relay-server-start.sh"

hooks:
  session: ".claude/hooks/relay-session-hook.js"
  setup: ".claude/hooks/relay-setup-hook.js"
  stop: ".claude/hooks/relay-stop-hook.js"
  install: "node .claude/hooks/relay-setup-hook.js"
