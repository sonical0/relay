<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 984 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relay-flow-fr-dark-title relay-flow-fr-dark-desc" id="relay-flow-fr-dark-root">
<title id="relay-flow-fr-dark-title">Le déroulé d’une session Relay</title>
<desc id="relay-flow-fr-dark-desc">Cycle d’une session Relay : le hook SessionStart injecte l’état généré dans l’agent ; à la fin de chaque réponse, le hook Stop lance after-turn, qui lit le journal et le brain synchronisés et reconstruit l’état et l’index de recherche.</desc>
