<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 984 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relay-flow-title relay-flow-desc" id="relay-flow-root">
<title id="relay-flow-title">How Relay runs a session</title>
<desc id="relay-flow-desc">Relay session cycle: the SessionStart hook injects the generated state into the agent; at the end of each reply the Stop hook launches after-turn, which reads the synced journal and brain and rebuilds the state and the search index.</desc>
